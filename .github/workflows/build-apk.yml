name: Build FIK Fire TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK provided by GitHub runner
        run: |
          test -d "$ANDROID_HOME" || { echo 'Android SDK unavailable'; exit 1; }
          echo "Android SDK location: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify non-invasive Fire TV app
        run: bash scripts/verify-safety.sh
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify ARM32-compatible universal APK
        run: bash scripts/verify-apk-compatibility.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FIK-FireTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
